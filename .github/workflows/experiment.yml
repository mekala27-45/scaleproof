name: Owned CPU and HPA experiment
on:
  push:
    branches: [build/scaleproof]
    paths: [requests/core.json]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scaleproof-owned-study
  cancel-in-progress: false
jobs:
  study:
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      TOKENIZERS_PARALLELISM: 'false'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install bounded dependencies
        run: |
          python -m pip install -e '.[inference,test]'
          curl -fL --retry 2 https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          chmod +x "$RUNNER_TEMP/kind"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - run: python -m unittest discover -s tests -v
      - run: python -m scaleproof.probe
      - run: python -m scaleproof.build_image
      - run: python -m scaleproof.bootstrap
      - name: Model and HPA smoke
        run: python -m scaleproof.smoke
      - name: Development calibration and frozen study
        run: |
          if python -c 'import json,sys; sys.exit(json.load(open("requests/core.json"))["mode"] != "full")'; then
            python -m scaleproof.calibrate
            python -m scaleproof.freeze_plan
            python -m scaleproof.run_pairs
            python -m scaleproof.recover_pod
            python -m scaleproof.grade
            python -m scaleproof.render
          fi
      - name: Preserve server diagnostics before cleanup
        if: always()
        run: |
          if test -f artifacts/private/ownership.json; then
            mkdir -p artifacts/raw/diagnostics
            kubectl --context kind-scaleproof -n scaleproof logs -l app=scaleproof --all-containers --prefix > artifacts/raw/diagnostics/pod-logs.txt 2>&1 || true
            kubectl --context kind-scaleproof -n scaleproof get pods,hpa,events -o yaml > artifacts/raw/diagnostics/cluster.yaml 2>&1 || true
            cat artifacts/raw/diagnostics/pod-logs.txt
          fi
      - name: Owned cleanup
        if: always()
        run: |
          if test -f artifacts/private/ownership.json; then
            python -m scaleproof.cleanup
          fi
      - name: Preserve evidence and failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scaleproof-evidence-${{ github.sha }}
          path: |
            artifacts/raw
            artifacts/manifests
            evaluation
            RESULTS.md
          retention-days: 14
