[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "scaleproof"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.115.12", "pydantic==2.11.5", "uvicorn==0.34.2", "httpx==0.28.1"]

[project.optional-dependencies]
inference = ["numpy==2.2.6", "onnxruntime==1.22.0", "tokenizers==0.21.1"]
postgres = ["psycopg[binary]==3.2.9"]
test = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]

[tool.setuptools.packages.find]
include = ["scaleproof*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
