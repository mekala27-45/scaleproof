name: Contracts and integration
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      matrix:
        hashseed: ["11", "97"]
    env:
      PYTHONHASHSEED: ${{ matrix.hashseed }}
      SCALEPROOF_PG_TEST_DSN: postgresql:///scaleproof
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGPASSWORD: scaleproof-ci-disposable
    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_DB: scaleproof
          POSTGRES_PASSWORD: scaleproof-ci-disposable
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,postgres,inference]'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scaleproof api
      - run: python -m scaleproof.audit_security
      - run: python scripts/validators/palette_validator.py palette.json
      - run: python scripts/investigate_closed_loop.py
